# Builds an installable debug APK on every push (or manually from the Actions tab).
# Download it from the run's "Artifacts" section and open it on your phone.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API address baked into the app (optional, can be changed in Settings)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_URL: ${{ github.event.inputs.api_url || vars.VITE_API_URL || '' }}

      - run: npx cap sync android

      - name: Build APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nagham-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
